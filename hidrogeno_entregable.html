<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entregable de Hidrógeno - SENER</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Merriweather:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/pages-common.css">

    <style>
        .deliverable-shell {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px 50px;
        }

        .deliverable-intro {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            border-top: 5px solid var(--color-gobmx-guinda);
            padding: 28px 30px;
            margin-bottom: 28px;
        }

        .deliverable-intro h1 {
            margin: 0;
            font-family: var(--font-family-headings);
            color: var(--color-gobmx-guinda);
            font-size: 2rem;
        }

        .deliverable-intro p {
            margin: 12px 0 0;
            color: #555;
            line-height: 1.7;
        }

        .deliverable-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
        }

        .deliverable-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(155, 34, 71, 0.08);
            color: var(--color-gobmx-guinda);
            border: 1px solid rgba(155, 34, 71, 0.15);
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 0.92rem;
            font-weight: 600;
        }

        .deliverable-status {
            background: #fff8ef;
            border: 1px solid rgba(179, 142, 93, 0.4);
            color: #715221;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 20px;
        }

        .deliverable-status.is-error {
            background: #fff2f2;
            border-color: rgba(155, 34, 71, 0.35);
            color: var(--color-gobmx-guinda);
        }

        .deliverable-frame {
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        #deliverable-root {
            min-height: 65vh;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 30px 20px;
            margin-top: 40px;
        }
    </style>
</head>

<body>
    <nav class="site-nav">
        <div class="nav-brand">
            <a href="index.html" style="color:white; text-decoration:none; display:flex; align-items:center;">
                <span style="font-size: 1.2rem; margin-right: 5px;"><i class="bi bi-bar-chart-fill"></i></span> SENER | DGTE
            </a>
        </div>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false"><span></span><span></span><span></span></button>
        <ul class="nav-menu">
            <li class="nav-item"><a href="index.html" class="nav-link">Inicio</a></li>
            <li class="nav-item"><a href="hidrogeno_verde.html" class="nav-link active">Hidrógeno Verde</a></li>
        </ul>
    </nav>

    <div class="deliverable-shell">
        <section class="deliverable-intro">
            <h1 data-deliverable-title>Entregable de Hidrógeno</h1>
            <p data-deliverable-subtitle>Visualización interactiva del análisis preparado para SENER.</p>
            <div class="deliverable-meta">
                <span class="deliverable-chip"><i class="bi bi-file-earmark-text"></i> Entregable D2</span>
                <span class="deliverable-chip"><i class="bi bi-code-slash"></i> Fuente: <span data-deliverable-source></span></span>
                <a class="deliverable-chip" href="hidrogeno_verde.html"><i class="bi bi-arrow-left"></i> Regresar al overview</a>
            </div>
        </section>

        <div id="deliverable-status" class="deliverable-status" hidden></div>

        <section class="deliverable-frame">
            <div id="deliverable-root"></div>
        </section>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 Secretaría de Energía | Subsecretaría de Planeación y Transición Energética</p>
        </div>
    </footer>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="js/pages-common.js"></script>
    <script src="js/hidrogeno-deliverable-loader.js"></script>
</body>

</html>
